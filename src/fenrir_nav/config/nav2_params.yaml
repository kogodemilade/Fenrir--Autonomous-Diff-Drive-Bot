amcl:
  ros__parameters:
    use_sim_time: true
    scan_topic: scan

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_vel_x: 0.0
    max_vel_x: 0.26
    max_vel_theta: 1.0
    controller_plugins: ["FollowPath"]

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

bt_navigator:
  ros__parameters:
    use_sim_time: true
    bt_xml_filename: bt_tree.xml

local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link

global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
